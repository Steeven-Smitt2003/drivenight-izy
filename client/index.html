<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F7FA" />
    <meta name="description" content="DriveNight, des trajets où passagers et chauffeurs conviennent ensemble du prix." />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>DriveNight — votre trajet, vos conditions</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('drivenight.theme');
        const theme = ['light', 'dark'].includes(savedTheme) ? savedTheme : 'system';
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = theme === 'system' ? (dark ? 'dark' : 'light') : theme;
        document.documentElement.dataset.theme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]').content =
          resolvedTheme === 'dark' ? '#101A2A' : '#F4F7FA';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
